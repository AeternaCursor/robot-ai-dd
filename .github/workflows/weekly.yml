name: weekly-update

on:
  schedule:
    - cron: '0 16 * * 0'   # 北京时间每周一 00:00
  workflow_dispatch:
    inputs:
      skip_news:
        description: '只重新生成网页，不抓新闻'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: 抓新闻并写入本周更新记录
        if: ${{ github.event_name == 'schedule' || !inputs.skip_news }}
        run: python -u tools/weekly.py
        timeout-minutes: 35
        continue-on-error: true
      - name: 保存加密数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "weekly update $(date -u +%F)"
          git push
      - name: 生成加密网页
        run: python tools/crypt.py build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
